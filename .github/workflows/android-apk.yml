name: Build JR Server Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [v3-development]
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Show build failure summary
        if: failure()
        run: |
          echo "===== JR SERVER MOBILE - BUILD ERROR ====="
          grep -n -E "FAILURE:|What went wrong:|Execution failed|e: |error:|Caused by:" build.log | tail -n 120 || true
          echo "===== LAST 160 LOG LINES ====="
          tail -n 160 build.log || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JR-Server-Mobile-build-log
          path: mobile-android/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JR-Server-Mobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JR-Server-Mobile-debug
          path: mobile-android/app/build/outputs/apk/debug/JR-Server-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
