name: Build JR Server Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [v3-development]
    paths:
      - "mobile-android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/JR-Server-Mobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JR-Server-Mobile-debug
          path: mobile-android/app/build/outputs/apk/debug/JR-Server-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 30
